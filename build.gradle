plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT' // Verwende 1.6 für neuere Versionen
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    mavenCentral()
}

dependencies {
    // Trage hier exakt deine Minecraft-Version ein (z. B. "26.1" oder die entsprechende Snapshot-Version)
    minecraft "com.mojang:minecraft:1.20.4" // Passe dies auf deine Zielversion an
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17 // Oder Java 21, falls 26.1 Java 21 erfordert
}

java {
    withSourcesJar()
}
